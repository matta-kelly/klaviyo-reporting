# Klaviyo connector config.

[account]
timezone = "US/Pacific"
# Klaviyo reporting days run midnight to midnight at this fixed UTC offset all
# year: a timeframe's dates are read on this clock and any offset in the string
# is ignored. That is Pacific time during daylight time and 11 PM to 11 PM
# Pacific during standard time. Flow series buckets are days on this clock.
report_day_utc_offset = -7

[api]
conversion_metric_id = "R8revz"  # Shopify Placed Order

# Retry and rate limiting are not configuration: they are what the API does.
# They live on KlaviyoAPI in client.py. The filter batch size is Klaviyo's cap,
# not a choice, and is FILTER_BATCH there.

[api.stats]
campaigns = [
  "recipients",
  "delivered",
  "opens_unique",
  "clicks_unique",
  "bounced",
  "unsubscribe_uniques",
  "spam_complaints",
  "conversion_uniques",
  "conversion_value",
]
flows = [
  "recipients",
  "delivered",
  "opens_unique",
  "clicks_unique",
  "conversion_uniques",
  "conversion_value",
]
